# GitHub Actions: deploy the CyberScan website to AWS on every push to main.
# Lives in the GitHub repository as .github/workflows/deploy-aws.yml (this file is the source copy).
#
# Secrets (Settings › Secrets and variables › Actions › Secrets) — an IAM user that may only deploy
# (policy: web_v/aws/iam/github-deploy-policy.json):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Variables (same page › Variables):
#   AWS_REGION          e.g. eu-north-1
#   LAMBDA_FUNCTION     the function name
#   LAMBDA_ALIAS        optional: alias the site uses (a new version is published and the alias moved)
#   ASSET_BUCKET        S3 bucket for Pyodide and the APK
#   ASSET_PREFIX        optional folder in the bucket, e.g. assets (served by CloudFront at /assets/*)
#   CLOUDFRONT_ID       optional: distribution to invalidate after a deploy
#   SITE_URL            e.g. https://ainex-ai.xyz (smoke test after the deploy)
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths: ["web_v/**", "core/**", "repair_engine/**", "rules/**", "ml/**", "ui/**", "reports/**", "monitoring/**", "config.py", ".github/workflows/deploy-aws.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # daily: fresh YARA-Forge rules, malware links and phishing lists

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the Lambda and asset packages
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "yara-x==1.23.0"   # compiles the YARA-Forge rules (same version as packed)
          python web_v/aws/build_lambda.py
          ls -la web_v/aws/out

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload the large files to S3
        env:
          BUCKET: ${{ vars.ASSET_BUCKET }}
          PREFIX: ${{ vars.ASSET_PREFIX }}
        run: |
          DEST="s3://$BUCKET/${PREFIX:+$PREFIX/}"
          mkdir -p assets && unzip -q web_v/aws/out/cyberscan-assets.zip -d assets
          up() { aws s3 cp "$1" "$DEST$2" --content-type "$3" --cache-control "${4:-public, max-age=86400}" ${5:+--content-disposition "$5"} --only-show-errors; echo "uploaded $2"; }
          for f in assets/pyodide/*; do
            name=$(basename "$f")
            case "$name" in
              *.wasm) type=application/wasm ;; *.mjs|*.js) type=text/javascript ;; *.json) type=application/json ;;
              *.zip) type=application/zip ;; *) type="text/plain; charset=utf-8" ;;
            esac
            up "$f" "pyodide/$name" "$type"
          done
          for apk in assets/downloads/*.apk; do
            up "$apk" "downloads/$(basename "$apk")" application/vnd.android.package-archive "public, max-age=3600" "attachment; filename=$(basename "$apk")"
          done

      - name: Update the Lambda function
        env:
          FN: ${{ vars.LAMBDA_FUNCTION }}
          ALIAS: ${{ vars.LAMBDA_ALIAS }}
          BUCKET: ${{ vars.ASSET_BUCKET }}
        run: |
          # through S3: the package (with the protection data) can be larger than a direct upload allows
          KEY="deploy/cyberscan-lambda.zip"
          aws s3 cp web_v/aws/out/cyberscan-lambda.zip "s3://$BUCKET/$KEY" --only-show-errors
          aws lambda update-function-code --function-name "$FN" --s3-bucket "$BUCKET" --s3-key "$KEY" --query 'LastModified' --output text
          aws lambda wait function-updated --function-name "$FN"
          if [ -n "$ALIAS" ]; then
            VERSION=$(aws lambda publish-version --function-name "$FN" --description "${GITHUB_SHA::7}" --query Version --output text)
            aws lambda update-alias --function-name "$FN" --name "$ALIAS" --function-version "$VERSION" --query 'FunctionVersion' --output text
          fi

      - name: Refresh CloudFront
        if: ${{ vars.CLOUDFRONT_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_ID }}" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Smoke test the live site
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          sleep 30
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")
          echo "GET / -> $code"; test "$code" = 200
          curl -sf -H 'X-CyberScan-Token: cyberscan-public' "$SITE/api/settings" | grep -q '"public": true'
          out=$(curl -s -X POST "$SITE/api/scan" -H 'X-CyberScan-Token: cyberscan-public' -H 'Content-Type: application/json' \
                -H "Origin: $SITE" -d '{"mode":"text","value":"powershell -enc SQBFAFgA"}')
          echo "$out" | head -c 160; echo
          echo "$out" | grep -q '"status": "done"'
          curl -sf -H 'X-CyberScan-Token: cyberscan-public' "$SITE/api/protection" | tee /dev/stderr | grep -q '"forge": true'
          code=$(curl -s -L -o /dev/null -w '%{http_code}' "$SITE/pyodide/pyodide.js")
          echo "pyodide -> $code"; test "$code" = 200
          code=$(curl -s -L -r 0-1023 -o /dev/null -w '%{http_code}' "$SITE/downloads/CyberScan-1.0.0.apk")
          echo "apk -> $code"; test "$code" = 206 -o "$code" = 200
